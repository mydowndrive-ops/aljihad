<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display TV - Masjid Jami' Al Jihad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
            color: #ffffff;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            display: none;
        }

        /* === 1. TAMPILAN SPLASH SCREEN ASLI === */
        #splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #0d4a2b 0%, #052917 55%, #01140b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .splash-logo-wrapper {
            position: relative;
            width: clamp(140px, 14vw, 190px);
            height: clamp(140px, 14vw, 190px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .splash-spinner-ring {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 3px solid rgba(212, 175, 55, 0.15);
            border-top: 3px solid #FFD700;
            border-right: 3px solid rgba(255, 215, 0, 0.6);
            animation: splashSpin 1.4s linear infinite;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
        }
        @keyframes splashSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .splash-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            animation: splashLogoPulse 3s ease-in-out infinite alternate;
        }
        @keyframes splashLogoPulse {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.03); }
        }
        .title {
            font-size: clamp(22px, 2.5vw, 34px);
            font-weight: 800;
            letter-spacing: 4px;
            color: #FFFFFF;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.4);
            margin-bottom: 14px;
            text-align: center;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 24px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.4);
            font-size: clamp(11px, 1vw, 13px);
            color: #E2E8F0;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        .dot {
            width: 9px;
            height: 9px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 10px #FFD700;
            animation: dotBlink 1.2s infinite ease-in-out;
        }
        @keyframes dotBlink {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        /* === 2. TAMPILAN HALAMAN PERBAIKAN (MAINTENANCE) === */
        #maintenance-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: radial-gradient(circle at center, #07351e 0%, #031c0e 65%, #010c06 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }
        .maintenance-card {
            background: rgba(8, 48, 27, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(12px);
            padding: clamp(24px, 4vw, 45px);
            border-radius: 24px;
            max-width: 650px;
            width: 92%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(212, 175, 55, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .maintenance-icon {
            font-size: clamp(38px, 4.5vw, 54px);
            margin-bottom: 14px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
        }
        .maintenance-badge {
            background: rgba(212, 175, 55, 0.15);
            color: #FFD700;
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: clamp(11px, 1vw, 13px);
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .maintenance-title {
            font-size: clamp(20px, 2.4vw, 30px);
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .maintenance-desc {
            font-size: clamp(13px, 1.1vw, 16px);
            color: #d1fae5;
            line-height: 1.6;
            margin-bottom: 22px;
        }
        .clock-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 10px 24px;
            border-radius: 14px;
            display: inline-flex;
            flex-direction: column;
            gap: 4px;
        }
        .clock-time {
            font-size: clamp(26px, 3.2vw, 42px);
            font-weight: 800;
            color: #FFD700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }
        .clock-date {
            font-size: clamp(11px, 0.95vw, 13px);
            color: #cbd5e1;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN DENGAN LOGO ASLI ANDA -->
    <div id="splash">
        <div class="splash-logo-wrapper">
            <div class="splash-spinner-ring"></div>
            <img id="splash-img"
                 alt="Logo Masjid Al-Jihad"
                 class="splash-logo-img">
        </div>
        <h2 class="title">MASJID JAMI' AL JIHAD</h2>
        <div class="status-pill">
            <span class="dot"></span>
            <span id="status-text">MEMUAT TAMPILAN...</span>
        </div>
    </div>

    <!-- 2. LAYAR INFORMASI PERBAIKAN -->
    <div id="maintenance-screen">
        <div class="maintenance-card">
            <div class="maintenance-icon">⚙️</div>
            <div class="maintenance-badge">
                <span class="dot"></span>
                <span>PEMELIHARAAN SISTEM</span>
            </div>
            <h1 class="maintenance-title">SEDANG DALAM PERBAIKAN</h1>
            <p class="maintenance-desc">
                Layanan Display TV Digital Masjid Jami' Al Jihad saat ini sedang dalam proses optimalisasi dan pemeliharaan server berkala. Layanan akan segera kembali aktif.
            </p>
            <div class="clock-box">
                <div class="clock-time" id="live-clock">--:--:--</div>
                <div class="clock-date" id="live-date">Memuat tanggal...</div>
            </div>
        </div>
    </div>

    <!-- 3. IFRAME DISPLAY TV RENDER -->
    <iframe id="main-frame" allow="autoplay; fullscreen"></iframe>

    <script>
        // ========================================================
        // SAKLAR KONTROL UTAMA:
        // Set TRUE  = Tampilkan layar "Sedang Dalam Perbaikan"
        // Set FALSE = Jalankan switcher 2 server Render normal
        // ========================================================
        const MODE_PERBAIKAN = true;

        // URL Dua Akun Render
        const SERVER_1 = "https://digitalaljihad1.onrender.com";   // Tanggal 1 - 15
        const SERVER_2 = "https://digital-aljihad.onrender.com";  // Tanggal 16 - 31

        // Penentuan Server Berdasarkan Tanggal
        const today = new Date();
        const currentDay = today.getDate();
        const activeServer = (currentDay <= 15) ? SERVER_1 : SERVER_2;
        const targetLabel = (currentDay <= 15) ? "RENDER 1 (Tgl 1-15)" : "RENDER 2 (Tgl 16-31)";

        // Path Gambar Logo Asli Anda
        const logoPath = "/storage/settings/rvcMSGBiimeHugzEGeJ066Bq3MlSwn3ekYiWj7MD.png";
        const fallbackLogoPath = "/img/logo-aljihad-transparent.png";

        const splash = document.getElementById('splash');
        const statusText = document.getElementById('status-text');
        const splashImg = document.getElementById('splash-img');
        const mainFrame = document.getElementById('main-frame');
        const maintenanceScreen = document.getElementById('maintenance-screen');

        // Memuat logo asli dengan fallback aman (mencegah loop)
        splashImg.src = activeServer + logoPath;
        splashImg.onerror = function() {
            this.onerror = null; // Menahan agar tidak terjadi perulangan error
            this.src = activeServer + fallbackLogoPath;
        };

        function dismissSplash() {
            if (!splash) return;
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.visibility = 'hidden';
                splash.style.display = 'none';
            }, 800);
        }

        // ========================================================
        // LOGIKA TAMPILAN
        // ========================================================
        if (MODE_PERBAIKAN) {
            // === MODE PERBAIKAN AKTIF ===
            if (statusText) statusText.textContent = "MEMPERSIAPKAN TAMPILAN...";

            // Menjalankan jam & tanggal digital di layar perbaikan
            function updateClock() {
                const now = new Date();
                const clockEl = document.getElementById('live-clock');
                const dateEl = document.getElementById('live-date');
                if (clockEl) {
                    clockEl.textContent = now.toLocaleTimeString('id-ID', { hour12: false });
                }
                if (dateEl) {
                    dateEl.textContent = now.toLocaleDateString('id-ID', {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });
                }
            }
            setInterval(updateClock, 1000);
            updateClock();

            // Transisi halus splash screen ke kartu informasi perbaikan
            setTimeout(dismissSplash, 2000);

            // Cek ulang otomatis setiap 5 menit
            setInterval(() => {
                window.location.reload();
            }, 300000);

        } else {
            // === MODE NORMAL (KEDUA SERVER RENDER AKTIF) ===
            if (maintenanceScreen) maintenanceScreen.style.display = "none";
            if (mainFrame) mainFrame.style.display = "block";

            if (statusText) statusText.textContent = `MENGHUBUNGKAN: ${targetLabel}...`;
            mainFrame.src = activeServer;

            mainFrame.onload = function() {
                if (statusText) statusText.textContent = "TAMPILAN SIAP";
                dismissSplash();
            };

            // Batas maksimal jika cold start
            setTimeout(dismissSplash, 35000);

            // Auto-switch tengah malam saat pergantian hari
            setInterval(() => {
                const now = new Date();
                if (now.getDate() !== currentDay) window.location.reload();
                if (now.getHours() === 3 && now.getMinutes() === 15 && now.getSeconds() < 60) {
                    window.location.reload();
                }
            }, 60000);
        }
    </script>
</body>
</html>
