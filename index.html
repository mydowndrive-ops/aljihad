<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display TV - Masjid Jami' Al Jihad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
        #splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #0d4a2b 0%, #052917 55%, #01140b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: #ffffff;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .splash-logo-wrapper {
            position: relative;
            width: clamp(140px, 14vw, 190px);
            height: clamp(140px, 14vw, 190px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .splash-spinner-ring {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 3px solid rgba(212, 175, 55, 0.15);
            border-top: 3px solid #FFD700;
            border-right: 3px solid rgba(255, 215, 0, 0.6);
            animation: splashSpin 1.4s linear infinite;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
        }
        @keyframes splashSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .splash-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            animation: splashLogoPulse 3s ease-in-out infinite alternate;
        }
        @keyframes splashLogoPulse {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.03); }
        }
        .title {
            font-size: clamp(22px, 2.5vw, 34px);
            font-weight: 800;
            letter-spacing: 4px;
            color: #FFFFFF;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.4);
            margin-bottom: 14px;
            text-align: center;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 24px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.4);
            font-size: clamp(11px, 1vw, 13px);
            color: #E2E8F0;
            letter-spacing: 1.5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .dot {
            width: 9px;
            height: 9px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 10px #FFD700;
            animation: dotBlink 1.2s infinite ease-in-out;
        }
        @keyframes dotBlink {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <!-- Splash Screen Dinamis -->
    <div id="splash">
        <div class="splash-logo-wrapper">
            <div class="splash-spinner-ring"></div>
            <img id="splash-img" alt="Logo Masjid Al-Jihad" class="splash-logo-img">
        </div>
        <h2 class="title">MASJID JAMI' AL JIHAD</h2>
        <div class="status-pill">
            <span class="dot" id="status-dot"></span>
            <span id="status-text">MEMERIKSA TANGGAL SERVER...</span>
        </div>
    </div>

    <!-- Iframe Display TV -->
    <iframe id="main-frame" allow="autoplay; fullscreen" loading="eager"></iframe>

    <script>
        // ========================================================
        // 1. KONFIGURASI DUA AKUN RENDER
        // ========================================================
        const SERVER_1 = "https://digitalaljihad1.onrender.com";   // Aktif: Tanggal 1 s/d 15
        const SERVER_2 = "https://digital-aljihad.onrender.com";  // Aktif: Tanggal 16 s/d 31

        // Path logo masjid
        const logoPath = "/storage/settings/rvcMSGBiimeHugzEGeJ066Bq3MlSwn3ekYiWj7MD.png";
        const fallbackLogoPath = "/img/logo-aljihad-transparent.png";

        // ========================================================
        // 2. PENENTUAN SERVER BERDASARKAN TANGGAL
        // ========================================================
        let currentDayActive = new Date().getDate(); // 1 - 31
        let primaryServer = (currentDayActive <= 15) ? SERVER_1 : SERVER_2;
        let backupServer  = (currentDayActive <= 15) ? SERVER_2 : SERVER_1;
        
        let primaryLabel = (currentDayActive <= 15) ? "RENDER 1 (Tgl 1-15)" : "RENDER 2 (Tgl 16-31)";
        let backupLabel  = (currentDayActive <= 15) ? "RENDER 2 (Cadangan)" : "RENDER 1 (Cadangan)";

        let isDisplayLoaded = false;
        let coldStartTimer = null;
        let failoverTimer = null;

        const splash = document.getElementById('splash');
        const statusText = document.getElementById('status-text');
        const splashImg = document.getElementById('splash-img');
        const mainFrame = document.getElementById('main-frame');

        // Pasang logo pada splash screen
        splashImg.src = primaryServer + logoPath;
        splashImg.onerror = function() {
            this.onerror = null;
            this.src = primaryServer + fallbackLogoPath;
            // Jika di primaryServer gagal, coba ambil logo dari backupServer
            this.onerror = function() {
                this.src = backupServer + fallbackLogoPath;
            };
        };

        function updateStatus(msg) {
            if (statusText) statusText.textContent = msg;
        }

        // ========================================================
        // 3. FUNGSI MENUTUP SPLASH SCREEN SECARA HALUS
        // ========================================================
        function dismissSplash() {
            if (isDisplayLoaded) return;
            isDisplayLoaded = true;
            if (coldStartTimer) clearTimeout(coldStartTimer);
            if (failoverTimer) clearTimeout(failoverTimer);

            updateStatus("TAMPILAN SIAP");
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                    splash.style.display = 'none';
                }, 800);
            }, 600);
        }

        // ========================================================
        // 4. MEMUAT SERVER KE IFRAME
        // ========================================================
        function startLoadingServer(targetUrl, targetLabel, isFallbackAttempt = false) {
            updateStatus(`MENGHUBUNGKAN: ${targetLabel}...`);
            mainFrame.src = targetUrl;

            // Jika butuh waktu > 7 detik, kemungkinan Render sedang Cold Start
            coldStartTimer = setTimeout(() => {
                if (!isDisplayLoaded) {
                    updateStatus("MEMBANGUNKAN SERVER RENDER...");
                }
            }, 7000);

            // Jika dalam 30 detik server belum terbuka dan belum mencoba fallback:
            // Alihkan otomatis ke akun Render yang satunya
            if (!isFallbackAttempt) {
                failoverTimer = setTimeout(() => {
                    if (!isDisplayLoaded) {
                        clearTimeout(coldStartTimer);
                        console.warn("Server utama tidak merespon/suspend. Beralih ke akun Render cadangan...");
                        updateStatus(`MENCOBA ${backupLabel}...`);
                        startLoadingServer(backupServer, backupLabel, true);
                    }
                }, 30000);
            }
        }

        // Jalankan pemuatan server utama saat pertama dibuka
        startLoadingServer(primaryServer, primaryLabel, false);

        // Saat iframe selesai memuat konten
        mainFrame.onload = function() {
            dismissSplash();
        };

        // Batas maksimal mutlak: jika setelah 50 detik belum tertutup, paksa buka splash
        setTimeout(() => {
            if (!isDisplayLoaded) {
                dismissSplash();
            }
        }, 50000);

        // ========================================================
        // 5. MONITOR PERGANTIAN HARI & AUTO-SWITCH TENGAH MALAM
        // ========================================================
        // Mengecek tanggal setiap 60 detik. Saat pergantian tanggal dari 15 ke 16 (atau akhir bulan ke tgl 1),
        // TV akan otomatis reload dan beralih server sendiri tanpa perlu disentuh.
        setInterval(() => {
            const now = new Date();
            const checkedDay = now.getDate();
            if (checkedDay !== currentDayActive) {
                console.log("Pergantian tanggal terdeteksi! Memperbarui akun Render...");
                window.location.reload();
            }

            // Pemeliharaan rutin memori TV setiap pukul 03:15 WIB (sebelum Subuh)
            if (now.getHours() === 3 && now.getMinutes() === 15 && now.getSeconds() < 60) {
                console.log("Penyegaran memori TV harian (03:15 WIB)...");
                window.location.reload();
            }
        }, 60000);
    </script>
</body>
</html>
