<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display TV - Masjid Jami' Al Jihad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
        /* Splash Screen Masjid Al-Jihad saat Render sedang bangun / memuat */
        #splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #0d4a2b 0%, #052917 55%, #01140b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: #ffffff;
            transition: opacity 0.8s ease;
        }
        .spinner-ring {
            width: 75px;
            height: 75px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid #FFD700;
            border-right: 4px solid rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
            margin-bottom: 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .title {
            font-size: clamp(20px, 2.5vw, 32px);
            font-weight: 800;
            letter-spacing: 3px;
            color: #FFFFFF;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.5);
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 20px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.4);
            font-size: 13px;
            color: #E2E8F0;
            letter-spacing: 1.5px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 8px #FFD700;
        }
        /* Penanda Server Kecil di Pojok Kanan Bawah */
        #server-badge {
            position: fixed;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: #a0aec0;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 10;
            font-family: monospace;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div id="splash">
        <div class="spinner-ring"></div>
        <div class="title">MASJID JAMI' AL JIHAD</div>
        <div class="status-pill">
            <span class="dot"></span>
            <span id="status-text">Menghubungkan ke Server Display TV...</span>
        </div>
    </div>

    <div id="server-badge">Server --</div>

    <iframe id="main-frame" src="" allow="autoplay"></iframe>

    <script>
        // DAFTAR KEDUA URL SERVER RENDER
        const SERVER_1 = 'https://digital-aljihad.onrender.com';
        const SERVER_2 = 'https://digitalaljihad1.onrender.com';

        // ROTASI OTOMATIS:
        // Tgl 1 - 15  : Prioritas Server 1 (Server 2 sleep/hemat kuota)
        // Tgl 16 - 31 : Prioritas Server 2 (Server 1 sleep/hemat kuota)
        const today = new Date().getDate();
        const isFirstHalf = today <= 15;

        let primaryUrl = isFirstHalf ? SERVER_1 : SERVER_2;
        let backupUrl  = isFirstHalf ? SERVER_2 : SERVER_1;
        let primaryName = isFirstHalf ? 'Server 1 (Tgl 1-15)' : 'Server 2 (Tgl 16-31)';
        let backupName  = isFirstHalf ? 'Server 2 (Cadangan)' : 'Server 1 (Cadangan)';

        const splash = document.getElementById('splash');
        const statusText = document.getElementById('status-text');
        const badge = document.getElementById('server-badge');
        const frame = document.getElementById('main-frame');

        let isLoaded = false;

        function loadDisplay(url, name, isBackup = false) {
            badge.innerText = name;
            statusText.innerText = isBackup 
                ? 'Server utama offline, beralih ke Server Cadangan...' 
                : 'Menghubungkan ke ' + name + '...';

            frame.src = url;

            // Timer Deteksi Otomatis (Failover):
            // Jika dalam 50 detik server utama belum terbuka (misal kena suspend/mati)
            const failsafeTimer = setTimeout(() => {
                if (!isLoaded && !isBackup) {
                    console.warn('Server utama tidak merespons dalam 50 detik, pindah ke server cadangan...');
                    loadDisplay(backupUrl, backupName, true);
                }
            }, 50000);

            frame.onload = () => {
                clearTimeout(failsafeTimer);
                isLoaded = true;
                // Hilangkan splash screen dengan mulus
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 800);
                }, 1500);
            };
        }

        // Jalankan pemuatan server
        loadDisplay(primaryUrl, primaryName);

        // Auto-refresh setiap 12 jam agar saat pergantian tanggal 15 ke 16,
        // TV otomatis berpindah server tanpa perlu restart TV
        setInterval(() => {
            window.location.reload();
        }, 12 * 60 * 60 * 1000);
    </script>
</body>
</html>
